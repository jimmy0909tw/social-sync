name: Run Social Dashboard Main Script

# 設定觸發條件：當程式碼推送到 main 分支，或是手動按鈕觸發
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊「Run workflow」按鈕執行

jobs:
  run-dashboard:
    runs-on: ubuntu-latest

    steps:
    # 1. 切換並拉取 Repository 程式碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 安裝 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 自動讀取 requirements.txt 並安裝所需套件
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. 在 GitHub 伺服器上執行 main.py (測試運行)
    - name: Run main.py
      run: |
        python -c "
        import main
        print('成功載入 main.py 及其相關套件！')
        "
